<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arabic 365: Daily Classical Arabic Coach</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #d1fae5;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      padding-bottom: 90px;
    }
    .header {
      max-width: 680px;
      margin: 0 auto 16px;
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .logo-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-vault {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #bfdbfe;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-fill {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .timer-card {
      max-width: 680px;
      margin: 0 auto 16px;
      background: #1e293b;
      color: white;
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .timer-display {
      font-family: ui-monospace, Menlo, Monaco, monospace;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .timer-controls { display: flex; gap: 8px; }
    .btn-timer {
      background: var(--primary);
      border: none;
      color: white;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-timer-reset {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .controls {
      max-width: 680px;
      margin: 0 auto 16px;
      display: flex;
      gap: 8px;
    }
    .search-box {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: white;
      outline: none;
    }
    .phase-select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      background: white;
      font-weight: 600;
      color: var(--text);
    }
    .card {
      max-width: 680px;
      margin: 0 auto 16px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }
    .card.completed {
      background: #f0fdf4;
      border-color: #86efac;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .day-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .check-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .card.completed .check-btn {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .triad-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .arabic-chip {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 19px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .arabic-chip span.en {
      font-size: 11px;
      color: #64748b;
      font-weight: normal;
    }
    .activity-section {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }
    .activity-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .activity-tag {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
    }
    .btn-swap {
      background: white;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .script-bubble {
      background: white;
      border: 1px solid #e2e8f0;
      border-right: 4px solid var(--primary);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 18px;
      direction: rtl;
      text-align: right;
      margin: 8px 0;
      line-height: 1.5;
      cursor: pointer;
    }
    .meta-line {
      font-size: 13px;
      color: #475569;
      margin-top: 6px;
      line-height: 1.4;
    }
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: white;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      max-height: 85vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.2);
    }
    .vault-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .vault-title {
      font-weight: 700;
      font-size: 16px;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="logo-title">📖 Arabic 365</div>
      <button class="btn-vault" onclick="openVault()">🎲 Activity Vault</button>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="stats-row">
      <span id="progressText">0 / 260 Days Completed</span>
      <span id="streakText">Phase 1: Foundations</span>
    </div>
  </div>

  <div class="timer-card">
    <div>
      <div style="font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700;">Guided 10-Min Session</div>
      <div class="timer-display" id="timerDisplay">10:00</div>
    </div>
    <div class="timer-controls">
      <button class="btn-timer" id="timerBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-timer-reset" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <div class="controls">
    <input type="text" class="search-box" id="searchInput" placeholder="Search Arabic, day, or keyword..." oninput="render()">
    <select class="phase-select" id="phaseSelect" onchange="render()">
      <option value="all">All Phases</option>
      <option value="1">Phase 1: Weeks 1–12</option>
      <option value="2">Phase 2: Weeks 13–24</option>
      <option value="3">Phase 3: Weeks 25–36</option>
      <option value="4">Phase 4: Weeks 37–48</option>
      <option value="5">Phase 5: Weeks 49–52</option>
    </select>
  </div>

  <div id="lessonContainer"></div>

  <!-- Activity Vault Modal -->
  <div class="modal-overlay" id="vaultModal" onclick="closeVault(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 18px;">🎲 12 Signature Activities</h3>
        <button onclick="closeVault()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b;">✕</button>
      </div>
      <div id="vaultList"></div>
    </div>
  </div>

  <script>
    // --- 12 Signature Games Reference Catalog ---
    const activityVault = [
      { id: "flashlight", name: "Flashlight Detective (كَشَّافُ الظَّلَام)", bestFor: "Nouns, Colors, Spatial Relations", desc: "Dim the room lights. Shine a flashlight beam on a specific target object. Ask: «مَاذَا تَرَى فِي الظَّلَام؟». Child shouts: «أَرَى كِتَابًا أَزْرَقَ!». Then let child search for items you call out." },
      { id: "tollbooth", name: "The Tollbooth Bridge (جِسْرُ الْمُرُور)", bestFor: "Requests: «أُرِيدُ... مِنْ فَضْلِكَ»", desc: "Stand in a doorway. To pass across the 'bridge', the child must hand over a toy ticket or request a required prop politely in Arabic: «أُرِيدُ التُّفَّاحَ مِنْ فَضْلِكَ!». You reply: «تَفَضَّلْ!» and let them jump through." },
      { id: "charades", name: "Action Charades (مَسْرَحُ الْأَفْعَال)", bestFor: "Dynamic Action Verbs (Eat, Drink, Sleep, Run)", desc: "Zero words allowed! Panto-mime dramatic actions (slurping hot tea, heavy snail walk). Child shouts the Arabic verb: «تَشْرَبُ مَاءً!» or «تَنَامُ عَلَى السَّرِير!». Then switch roles." },
      { id: "monster_feed", name: "Feed the Monster / Puppet (أَطْعِمِ الْوَحْش)", bestFor: "Food Vocabulary, Body Parts, Negative Commands", desc: "Use a box with a cut-out mouth or a puppet. Monster commands hungrily: «الْوَحْشُ جَائِع! أُرِيدُ خُبْزًا!». Child grabs the item and feeds it: «كُلِ الْخُبْز!». If you try to eat a pen, child stops you: «لَا! هٰذَا قَلَم!»." },
      { id: "cups", name: "Memory Cup Shuffle (خِدْعَةُ الْأَكْوَاب)", bestFor: "Preposition «تَحْتَ...» (Under), Interrogatives", desc: "Place 3 opaque cups upside down. Hide a small token under one cup: «السَّمَكَةُ تَحْتَ الْكُوب». Shuffle the cups for 5 seconds. Child must announce in a complete sentence: «السَّمَكَةُ تَحْتَ هٰذَا الْكُوب!» before lifting it." },
      { id: "scavenger", name: "Ayna al-... Scavenger Grab (أَيْنَ الْـ...؟)", bestFor: "Concrete Nouns, Household Objects", desc: "Scatter real items across the carpet. Shout: «أَيْنَ الْكِتَاب؟!». Child races to grab or touch it within 5 seconds and holds it up: «هٰذَا كِتَاب!»." },
      { id: "islands", name: "Color Islands (جَزَائِرُ الْأَلْوَان)", bestFor: "Colors & Directions", desc: "Place colored sheets of construction paper on the floor. Shout: «إِلَى الْأَحْمَر!» or «ضَعِ الْقَلَمَ عَلَى الْأَخْضَر!». Child leaps to the color before 3 seconds elapse." },
      { id: "simon", name: "Amir Yaqool (الْأَمِير يَقُول - Simon Says)", bestFor: "Movement Imperatives & Body Parts", desc: "Leader commands: «الْأَمِير يَقُول: اِقْفِزْ!». Child jumps. If leader says «اِجْلِسْ!» without «الْأَمِير يَقُول», the child must freeze." },
      { id: "monster_draw", name: "Monster Whiteboard Dictation (رَسْمُ الْوَحْش)", bestFor: "Anatomy, Numbers 1–5, Sizes", desc: "Parent dictates ridiculous body counts to draw: «اُرْسُمْ رَأْسًا كَبِيرًا! أَرْبَعَ أَعْيُن! فَمًا وَاحِدًا!». Compare silly monster drawings." },
      { id: "freeze_dance", name: "Opposites Freeze Dance (رَقْصَةُ الْأَضْدَاد)", bestFor: "Size & Speed Opposites", desc: "Play music. Stop music and call out: «أَنْتُمْ كِبَار!» (Stretch wide like giants) vs «صَغِير!» (Curled into a ball). Alternate «سَرِيع» with «بَطِيء»." },
      { id: "kitchen", name: "Kitchen Pretend Cafe (مَطْعَمُ الْبَيْت)", bestFor: "Food, Utensils, Sensory Temps", desc: "Child acts as waiter or customer. «مَاذَا تُرِيد؟» $\rightarrow$ «أُرِيدُ مَاءً بَارِدًا». Serve cups and bread while practicing hospitality phrases." },
      { id: "spot_error", name: "Spot the Absurd Lie (اكْتَشِفِ الْخَطَأ)", bestFor: "Listening Comprehension & Confidence", desc: "Make a deliberately ridiculous statement matching an action (e.g., hold up a shoe and say «هٰذَا خُبْزٌ لَذِيذ!»). Child buzzes in and corrects you: «لَا! هٰذَا حِذَاء!»." }
    ];

    // --- Curriculum Data Generator (All 260 Days) ---
    const phases = [
      { id: 1, name: "Phase 1: Sensory & Physical Foundations", weeks: [1, 12] },
      { id: 2, name: "Phase 2: Functional Living & Root Families", weeks: [13, 24] },
      { id: 3, name: "Phase 3: Classical Literature & Narrative", weeks: [25, 36] },
      { id: 4, name: "Phase 4: Conversational Fluency & Hadith", weeks: [37, 48] },
      { id: 5, name: "Phase 5: Synthesis & Independent Fluency", weeks: [49, 52] }
    ];

    // Baseline curriculum generator with 3 words/day and game mappings
    const lessons = [];
    const coreNouns = [
      ["كِتَابٌ", "قَلَمٌ", "كُوبٌ"], ["بَابٌ", "كُرْسِيٌّ", "طَاوِلَةٌ"],
      ["سَرِيرٌ", "صُنْدُوقٌ", "مِفْتَاحٌ"], ["مَاءٌ", "خُبْزٌ", "تُفَّاحٌ"],
      ["حَلِيبٌ", "عَصِيرٌ", "لَحْمٌ"], ["قِطَّةٌ", "كَلْبٌ", "عَصْفُورٌ"],
      ["سَمَكَةٌ", "حِصَانٌ", "خَرُوفٌ"], ["رَأْسٌ", "عَيْنٌ", "أَنْفٌ"],
      ["فَمٌ", "يَدٌ", "رِجْلٌ"], ["أُذُنٌ", "بَطْنٌ", "ظَهْرٌ"]
    ];
    const coreVerbs = [
      ["قِفْ", "اِجْلِسْ", "اِمْشِ"], ["اِقْفِزْ", "اِجْرِ", "تَوَقَّفْ"],
      ["كُلْ", "اِشْرَبْ", "نَمْ"], ["اُنْظُرْ", "اِسْمَعْ", "تَعَالَ"],
      ["خُذْ", "هَاتِ", "اِفْتَحْ"], ["أَغْلِقْ", "اِغْسِلْ", "نَاوِلْنِي"]
    ];
    const coreRoots = [
      { root: "ك-ت-ب", words: ["كَتَبَ", "كِتَابٌ", "مَكْتَبٌ"] },
      { root: "د-ر-س", words: ["دَرَسَ", "دَرْسٌ", "مَدْرَسَةٌ"] },
      { root: "ل-ع-ب", words: ["لَعِبَ", "لُعْبَةٌ", "مَلْعَبٌ"] },
      { root: "س-ج-د", words: ["سَجَدَ", "سُجُودٌ", "مَسْجِدٌ"] },
      { root: "ط-ب-خ", words: ["طَبَخَ", "طَبَّاخٌ", "مَطْبَخٌ"] }
    ];

    for (let day = 1; day <= 260; day++) {
      const week = Math.ceil(day / 5);
      const dayOfWeek = ((day - 1) % 5) + 1;
      let phaseId = 1;
      if (week > 48) phaseId = 5;
      else if (week > 36) phaseId = 4;
      else if (week > 24) phaseId = 3;
      else if (week > 12) phaseId = 2;

      let title = `Week ${week}, Day ${dayOfWeek}`;
      let words = [];
      let defaultGame = activityVault[(day - 1) % activityVault.length];
      let script = "";
      let goal = "";

      if (phaseId === 1) {
        if (dayOfWeek <= 2) {
          const pair = coreNouns[(day - 1) % coreNouns.length];
          words = [pair[0], pair[1], pair[2]];
          title = "Everyday Objects & Touch Reflex";
          script = `«أَيْنَ ${words[0]}؟... هٰذَا ${words[0]}!»`;
          goal = "Child points to or grabs target item upon hearing vocalized name.";
          defaultGame = activityVault[5]; // Scavenger Grab
        } else if (dayOfWeek === 3) {
          const v = coreVerbs[(day - 1) % coreVerbs.length];
          words = [v[0], v[1], v[2]];
          title = "Action Commands & Movement";
          script = `«الْأَمِير يَقُول... ${words[0]}! ثُمَّ ${words[1]}!»`;
          goal = "Child physically executes commands immediately without hesitation.";
          defaultGame = activityVault[7]; // Simon Says
        } else if (dayOfWeek === 4) {
          words = ["أَحْمَر", "أَزْرَق", "أَخْضَر"];
          title = "Colors & Spatial Anchors";
          script = `«إِلَى الْأَحْمَر! ضَعِ الْكِتَابَ عَلَى الْأَزْرَق!»`;
          goal = "Child leaps onto color sheets or places items on target colors.";
          defaultGame = activityVault[6]; // Islands
        } else {
          words = ["كَبِيرٌ", "صَغِيرٌ", "سَرِيعٌ"];
          title = "Physical Opposites & Review";
          script = `«أَنْتُمْ كِبَار!... صَغِير!... اِمْشِ سَرِيع!»`;
          goal = "Full-body posture shifts expressing scale and velocity.";
          defaultGame = activityVault[9]; // Freeze Dance
        }
      } else if (phaseId === 2) {
        if (dayOfWeek <= 2) {
          words = ["أَسْتَيْقِظُ", "أَغْسِلُ", "آكُلُ"];
          title = "Daily Routine & Present Tense Verbs";
          script = `«مَاذَا تَفْعَلُ الْآن؟... أَنَا أَغْسِلُ وَجْهِي!»`;
          goal = "Answering what they are currently doing using 1st-person present tense.";
          defaultGame = activityVault[2]; // Charades
        } else if (dayOfWeek <= 4) {
          const r = coreRoots[(day - 1) % coreRoots.length];
          words = r.words;
          title = `Root Family Discovery: [${r.root}]`;
          script = `«عِنْدَنَا جِذْرٌ سِرِّيّ: ${r.root}... كَتَبَ، كِتَاب، مَكْتَب!»`;
          goal = "Spotting the 3 common root letters shared across related words.";
          defaultGame = activityVault[0]; // Flashlight
        } else {
          words = ["بَيْتِي", "كِتَابُكَ", "قَلَمِي"];
          title = "Possessive Pronouns & Ownership";
          script = `«هٰذَا قَلَمِي! هٰذَا كِتَابُكَ!»`;
          goal = "Distinguishing between my item (-ee) and your item (-uka).";
          defaultGame = activityVault[1]; // Tollbooth
        }
      } else if (phaseId === 3) {
        words = ["ذَهَبَ", "رَأَى", "قَالَ"];
        title = "Classical Reader: Qasas al-Nabiyyīn (Vignette)";
        script = `«ذَهَبَ إِبْرَاهِيمُ... رَأَى الْأَصْنَامَ فَقَالَ: مَا هٰذَا؟»`;
        goal = "Echoing 3-part narrative sequence and pointing to story props.";
        defaultGame = activityVault[3]; // Monster Feed / Puppet
      } else if (phaseId === 4) {
        words = ["تَبَسَّمَ", "صَدَقَةٌ", "أَخِيكَ"];
        title = "Prophetic Speech & Ethical Rhythm";
        script = `«تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ صَدَقَةٌ»`;
        goal = "Reciting classical rhythmic phrase with natural pauses.";
        defaultGame = activityVault[11]; // Spot the Lie
      } else {
        words = ["أُرِيدُ أَنْ...", "لِأَنَّ...", "فِي الْحَقِيقَةِ"];
        title = "Spontaneous Synthesis & Free Narration";
        script = `«مَاذَا حَدَثَ الْيَوْم؟... احْكِ لِي قِصَّةً صَغِيرَة!»`;
        goal = "Child constructs 3 linked sentences in Fus'ha from personal memory.";
        defaultGame = activityVault[1]; // Tollbooth
      }

      lessons.push({
        id: day,
        week: week,
        dayOfWeek: dayOfWeek,
        phase: phaseId,
        title: title,
        words: words,
        script: script,
        goal: goal,
        currentGame: defaultGame
      });
    }

    // --- State & Audio Handlers ---
    let completedDays = JSON.parse(localStorage.getItem('arabic365_completed') || '[]');
    let customGameOverrides = JSON.parse(localStorage.getItem('arabic365_game_overrides') || '{}');

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[«»]/g, '').trim();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'ar-SA';
        u.rate = 0.45;
        window.speechSynthesis.speak(u);
      }
    }

    function toggleComplete(dayId) {
      if (completedDays.includes(dayId)) {
        completedDays = completedDays.filter(d => d !== dayId);
      } else {
        completedDays.push(dayId);
      }
      localStorage.setItem('arabic365_completed', JSON.stringify(completedDays));
      render();
    }

    function swapActivity(dayId) {
      const current = customGameOverrides[dayId] || lessons[dayId - 1].currentGame.id;
      const otherGames = activityVault.filter(g => g.id !== current);
      const randomNew = otherGames[Math.floor(Math.random() * otherGames.length)];
      customGameOverrides[dayId] = randomNew.id;
      localStorage.setItem('arabic365_game_overrides', JSON.stringify(customGameOverrides));
      render();
    }

    // --- Timer Logic ---
    let timerDuration = 600;
    let timerRunning = false;
    let timerInterval = null;

    function toggleTimer() {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timerBtn').innerText = 'Start';
      } else {
        timerRunning = true;
        document.getElementById('timerBtn').innerText = 'Pause';
        timerInterval = setInterval(() => {
          if (timerDuration > 0) {
            timerDuration--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            document.getElementById('timerBtn').innerText = 'Done!';
            if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timerDuration = 600;
      document.getElementById('timerBtn').innerText = 'Start';
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerDuration / 60);
      const secs = timerDuration % 60;
      document.getElementById('timerDisplay').innerText = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // --- Vault Modal Handlers ---
    function openVault() {
      const list = document.getElementById('vaultList');
      list.innerHTML = activityVault.map(a => `
        <div class="vault-card">
          <div class="vault-title">${a.name}</div>
          <div style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px;">BEST FOR: ${a.bestFor}</div>
          <div style="font-size: 13px; color: #334155; line-height: 1.4;">${a.desc}</div>
        </div>
      `).join('');
      document.getElementById('vaultModal').classList.add('active');
    }

    function closeVault() {
      document.getElementById('vaultModal').classList.remove('active');
    }

    // --- Main Render Loop ---
    function render() {
      const container = document.getElementById('lessonContainer');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const phaseFilter = document.getElementById('phaseSelect').value;

      const filtered = lessons.filter(l => {
        const matchesPhase = (phaseFilter === 'all') || (l.phase.toString() === phaseFilter);
        const matchesSearch = !search || 
          l.title.toLowerCase().includes(search) || 
          l.id.toString() === search || 
          l.words.some(w => w.includes(search));
        return matchesPhase && matchesSearch;
      });

      container.innerHTML = filtered.map(l => {
        const isDone = completedDays.includes(l.id);
        const activeGameId = customGameOverrides[l.id] || l.currentGame.id;
        const activeGame = activityVault.find(g => g.id === activeGameId) || l.currentGame;

        return `
          <div class="card ${isDone ? 'completed' : ''}" id="day-${l.id}">
            <div class="card-header">
              <div>
                <div class="day-badge">Day ${l.id} • Week ${l.week} (Day ${l.dayOfWeek})</div>
                <h3 class="card-title">${l.title}</h3>
              </div>
              <button class="check-btn" onclick="toggleComplete(${l.id})">${isDone ? '✓' : ''}</button>
            </div>

            <div class="triad-box">
              ${l.words.map(w => `
                <button class="arabic-chip" onclick="speak('${w}')">
                  🔊 ${w}
                </button>
              `).join('')}
            </div>

            <div class="activity-section">
              <div class="activity-header">
                <span class="activity-tag">🎯 Game: ${activeGame.name.split(' (')[0]}</span>
                <button class="btn-swap" onclick="swapActivity(${l.id})">🔀 Swap Game</button>
              </div>
              <div class="meta-line" style="font-size: 12px; margin-bottom: 8px;"><strong>Rule:</strong> ${activeGame.desc}</div>
              <div class="script-bubble" onclick="speak('${l.script}')">
                🔊 ${l.script}
              </div>
            </div>

            <div class="meta-line" style="margin-top: 10px;">
              <strong>Daily Goal:</strong> ${l.goal}
            </div>
          </div>
        `;
      }).join('');

      // Update Top Metrics
      const pct = Math.round((completedDays.length / 260) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').innerText = `${completedDays.length} / 260 Days Completed (${pct}%)`;
    }

    render();
  </script>
</body>
</html>
